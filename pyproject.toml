[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-project-stewardship"
version = "0.1.0"
description = "Durable project ownership for Hermes agent fleets: verified cycles, bounded initiatives, explicit autonomy policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sahil Saghir" }]
keywords = ["hermes", "agents", "autonomy", "kanban", "project-ownership"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
desktop-panel = ["fastapi", "uvicorn"]
dev = ["pytest>=7", "pytest-timeout"]

[project.scripts]
stewardctl = "hermes_project_stewardship.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_project_stewardship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
filterwarnings = [
  # starlette 1.x prefers httpx2 for TestClient; fastapi 0.141 still pins httpx.
  # Remove this + add httpx2 once fastapi ships an httpx2-based testclient.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
