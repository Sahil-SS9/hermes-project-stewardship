name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      - name: Run tests with coverage gate
        run: pytest --cov=hermes_project_stewardship --cov-report=term --cov-fail-under=90
      - name: Byte-compile check
        run: python -m compileall src tests

  api-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with API extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop-panel]"
      - name: Import RPC app
        run: python -c "from hermes_project_stewardship.api.server import app; print('rpc-ok')"
